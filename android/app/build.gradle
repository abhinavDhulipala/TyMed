plugins {
  id("com.android.application")
  id("org.jetbrains.kotlin.android")
  id("org.jetbrains.kotlin.plugin.compose")
  id("com.google.devtools.ksp")
  id("io.sentry.android.gradle")
}

def keystorePropertiesFile = rootProject.file("../keystore.properties")
def keystoreProperties = new Properties()
def hasReleaseKeystore = keystorePropertiesFile.exists()
if (hasReleaseKeystore) {
  keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// versionName/versionCode default to the values below for local builds; CI overrides both from
// the pushed `vX.Y.Z` tag (see .github/workflows/release.yml) with -PtymedVersionName/-PtymedVersionCode
// so a strictly-increasing versionCode is required for "install over the old build" to work as an
// update rather than being rejected or (worse) wiping data on a fresh install.
def appVersionName = project.findProperty("tymedVersionName") ?: "1.0.7"
def appVersionCode = (project.findProperty("tymedVersionCode") ?: "7") as Integer

android {
  namespace "com.tymed.app"
  compileSdk 36

  defaultConfig {
    applicationId "com.tymed.app"
    minSdk 24
    targetSdk 36
    versionCode appVersionCode
    versionName appVersionName
    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

    def sentryDsn = System.getenv("SENTRY_DSN") ?: (project.findProperty("SENTRY_DSN") ?: "")
    buildConfigField "String", "SENTRY_DSN", "\"${sentryDsn}\""
  }

  signingConfigs {
    debug {
      storeFile file("debug.keystore")
      storePassword "android"
      keyAlias "androiddebugkey"
      keyPassword "android"
    }
    if (hasReleaseKeystore) {
      release {
        storeFile rootProject.file(keystoreProperties["RELEASE_STORE_FILE"])
        storePassword keystoreProperties["RELEASE_STORE_PASSWORD"]
        keyAlias keystoreProperties["RELEASE_KEY_ALIAS"]
        keyPassword keystoreProperties["RELEASE_KEY_PASSWORD"]
      }
    }
  }

  buildTypes {
    debug {
      signingConfig signingConfigs.debug
      applicationIdSuffix ".dev"
      versionNameSuffix "-dev"
    }
    release {
      // Falls back to debug signing (with a warning) if keystore.properties isn't present
      // locally — matches the old behavior so a plain clone can still produce a runnable APK.
      signingConfig hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug
      minifyEnabled Boolean.parseBoolean(findProperty("android.enableMinifyInReleaseBuilds") ?: "false")
      shrinkResources Boolean.parseBoolean(findProperty("android.enableShrinkResourcesInReleaseBuilds") ?: "false")
      proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
    // java.time.* (used throughout for recurrence/date logic) is only natively available on API
    // 26+; minSdk here is 24, so it needs desugaring to avoid crashing on API 24-25 devices.
    coreLibraryDesugaringEnabled true
  }
  kotlinOptions {
    jvmTarget = "17"
    freeCompilerArgs += ["-opt-in=androidx.compose.material3.ExperimentalMaterial3Api"]
  }

  buildFeatures {
    compose true
    buildConfig true
  }

  packaging {
    resources {
      excludes += ["/META-INF/{AL2.0,LGPL2.1}", "META-INF/DEPENDENCIES"]
    }
  }
}

ksp {
  arg("room.schemaLocation", "$projectDir/schemas")
}

dependencies {
  coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"

  implementation "androidx.core:core-ktx:1.17.0"
  implementation "androidx.core:core-splashscreen:1.2.0"
  implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.10.0"
  implementation "androidx.lifecycle:lifecycle-runtime-compose:2.10.0"
  implementation "androidx.lifecycle:lifecycle-viewmodel-compose:2.10.0"
  implementation "androidx.activity:activity-compose:1.11.0"
  implementation "com.google.android.material:material:1.12.0"
  implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0"

  implementation platform("androidx.compose:compose-bom:2026.01.00")
  implementation "androidx.compose.ui:ui"
  implementation "androidx.compose.ui:ui-graphics"
  implementation "androidx.compose.ui:ui-tooling-preview"
  implementation "androidx.compose.material3:material3"
  implementation "androidx.compose.material:material-icons-extended"
  implementation "androidx.navigation:navigation-compose:2.9.4"
  debugImplementation "androidx.compose.ui:ui-tooling"

  implementation "androidx.room:room-runtime:2.7.2"
  implementation "androidx.room:room-ktx:2.7.2"
  ksp "androidx.room:room-compiler:2.7.2"

  // ML Kit GenAI's AAR manifests (genai-prompt, genai-common) declare minSdkVersion 26 — above
  // this app's minSdkVersion 24. See the <uses-sdk tools:overrideLibrary=.../> entry in
  // AndroidManifest.xml, and GeminiNanoClient's runtime SDK_INT gate that makes that safe.
  // Pinned to beta2: beta3+ are compiled with Kotlin 2.3, newer than this project's Kotlin 2.1.
  implementation "com.google.mlkit:genai-prompt:1.0.0-beta2"

  implementation "io.sentry:sentry-android:8.58.0"

  testImplementation "junit:junit:4.13.2"
  testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.11.0"
  // Needed so tests touching org.json.* (the AI tool-call JSON encoding) or an in-memory Room
  // database get real behavior instead of the "Stub!" exceptions android.jar throws in plain
  // local unit tests.
  testImplementation "org.robolectric:robolectric:4.17"
  testImplementation "androidx.test:core:1.7.0"
  testImplementation "androidx.room:room-testing:2.7.2"

  // Room's MigrationTestHelper needs a real platform SQLite implementation, so the migration
  // adoption test lives under androidTest (device/emulator) rather than local `test`.
  androidTestImplementation "junit:junit:4.13.2"
  androidTestImplementation "androidx.test:runner:1.7.0"
  androidTestImplementation "androidx.test.ext:junit:1.3.0"
}
