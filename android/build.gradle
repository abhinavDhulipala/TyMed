// Top-level build file: declares plugin versions once so `app/build.gradle` can apply them
// without repeating a version (the "plugins DSL" version-catalog-free pattern).
plugins {
  id("com.android.application") version "8.12.0" apply false
  id("org.jetbrains.kotlin.android") version "2.1.20" apply false
  id("org.jetbrains.kotlin.plugin.compose") version "2.1.20" apply false
  id("com.google.devtools.ksp") version "2.1.20-2.0.1" apply false
  id("io.sentry.android.gradle") version "6.23.0" apply false
}
