plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.tymedalarm'
version = '0.1.0'

android {
  namespace "expo.modules.tymedalarm"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  implementation 'androidx.appcompat:appcompat:1.7.1'
  implementation 'androidx.core:core-ktx:1.13.1'
}
