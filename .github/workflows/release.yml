name: Release

# Building and publishing an APK only happens for an explicit version tag (vX.Y.Z) — pushing to
# main does not trigger this, so day-to-day commits stay free. Tag a commit to cut a release:
#   git tag v1.0.1 && git push origin v1.0.1
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK cmdline-tools
        run: |
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -sSL -o cmdline-tools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip
          unzip -q cmdline-tools.zip -d "$SDK_ROOT/cmdline-tools"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Install required Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Restore release keystore
        working-directory: .
        run: |
          mkdir -p keystores
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > keystores/tymed-release.jks
          cat > keystore.properties <<EOF
          RELEASE_STORE_FILE=../keystores/tymed-release.jks
          RELEASE_STORE_PASSWORD=${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}
          EOF

      - name: Derive version name/code from tag
        # Android refuses to install a build over an existing one unless versionCode strictly
        # increases (same/lower and it's rejected or, on a signature/version mismatch, treated as
        # a fresh install that wipes data) — without this every build defaulted to versionCode 1
        # forever, silently breaking "install to update" and the history it's supposed to
        # preserve. Mirrors the old scripts/set-version-from-tag.js: versionCode = major*10000 +
        # minor*100 + patch — room for 99 minor/patch versions per major, plenty for this app's
        # pace, and versionCode only needs to keep increasing, never be "clean."
        run: |
          TAG="${{ github.ref_name }}"
          if [[ ! "$TAG" =~ ^v?([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Tag \"$TAG\" isn't of the form vX.Y.Z" >&2
            exit 1
          fi
          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          PATCH="${BASH_REMATCH[3]}"
          VERSION_NAME="$MAJOR.$MINOR.$PATCH"
          VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          echo "Version $VERSION_NAME (versionCode $VERSION_CODE) from tag $TAG"
          echo "TYMED_VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "TYMED_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          # No Sentry project is configured yet — without this, the Sentry Gradle plugin hard-
          # fails a release build trying to upload source maps. Remove once SENTRY_DSN and a real
          # Sentry auth token are wired up as secrets.
          SENTRY_DISABLE_AUTO_UPLOAD: 'true'
        run: >
          ./gradlew assembleRelease
          -PtymedVersionName="$TYMED_VERSION_NAME"
          -PtymedVersionCode="$TYMED_VERSION_CODE"

      - name: Rename APK for the release
        working-directory: .
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/TyMed-${{ github.ref_name }}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/TyMed-${{ github.ref_name }}.apk
          generate_release_notes: true
